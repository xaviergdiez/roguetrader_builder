name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Checks, API tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chrome is preinstalled on the runner; tests/e2e/cdp.mjs finds /usr/bin/google-chrome.
      - run: npm run test:e2e
